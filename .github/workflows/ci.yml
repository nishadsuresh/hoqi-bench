name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev,validation]"

      - name: Lint (ruff)
        run: ruff check src/ tests/ scripts/

      - name: Type check (mypy strict)
        run: mypy

      - name: Test (pytest)
        run: pytest -v --cov=hoqi_bench --cov-report=term-missing

  # Day 26 (docs/WEEK3-4_PLAN.md, docs/journal/day26.md): reproducibility
  # is this project's STATED CONTRIBUTION (docs/WEEK1-2_AUDIT.md item B5)
  # and was, until this job existed, only evidenced by tests that check
  # INTERNAL consistency (run twice, get the same bytes) -- never against
  # an external, committed reference, and never on anything but Linux.
  # This job runs the smoke campaign on every combination of the three
  # major OSes and both supported Python versions and asserts the result
  # matches ONE committed SHA-256 hash (tests/test_reproducibility.py) --
  # turning "reproducible" from a claim about one machine on one day into
  # a claim checked on every push, everywhere this project says it runs.
  #
  # Deliberately narrow scope, not a second full test/lint/typecheck pass:
  # running ruff/mypy on 6 (os x python) cells would be pure duplication of
  # the job above, which already covers that on Ubuntu. This job's only
  # job is the one thing the job above CANNOT check -- does the actual
  # numerical output match across platforms.
  cross-platform-reproducibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Deliberately WITHOUT the `validation` extra: this job runs only
      # tests/test_reproducibility.py (see the pytest invocation below),
      # which does not import lsq-ellipse/ellipsinator -- narrowing the
      # install here keeps this job's only purpose (cross-platform
      # numerical reproducibility) uncoupled from Day 19's external
      # cross-validation packages, which have their own, separate
      # cross-platform wheel-availability risk not worth taking on here.
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Cross-platform smoke-campaign reproducibility check
        run: pytest tests/test_reproducibility.py -v
