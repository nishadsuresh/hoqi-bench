[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hoqi-bench"
version = "0.1.0"
description = "Reproducible benchmark for phase-recovery and nonlinearity-correction methods in homodyne quadrature interferometry (HoQI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nishad Suresh" }]
# Pinned to EXACT versions, not floors, as of Day 26 (docs/WEEK3-4_PLAN.md's
# reproducibility-hardening day, docs/journal/day26.md). This closes a real
# gap found on Day 24: `pandas>=2.0` resolved to pandas 2.3.3 on CI's Python
# 3.10 job and pandas 3.0.5 (a MAJOR version) on the 3.11 job, from the same
# commit -- proof that a loose floor is not "reproducible," it's "whatever
# pip resolves today." Every version below was verified (PyPI wheel listing,
# not assumed) to ship wheels for cp310 AND cp311 across Linux, macOS, and
# Windows -- the exact three-OS x two-Python matrix this project's CI now
# runs -- so pinning here cannot silently break one cell of that matrix.
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "sympy==1.14.0",
    "matplotlib==3.10.9",
    "pandas==2.3.3",
    "pyarrow==25.0.0",
    "tomli==2.4.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
    "mypy==2.3.0",
    "pandas-stubs==2.3.3.260113",
    "ipykernel==7.3.0",
    "nbclient==0.11.0",
    "nbformat==5.10.4",
]
# Tier 2 external cross-validation (docs/WEEK3-4_PLAN.md Day 19, moved up
# from Day 21 deliberately -- days of debugging headroom instead of hours
# before a blocking gate): NEVER a runtime dependency of the package
# itself, only of tests/test_external_cross_validation.py. Known coverage
# hole, stated plainly rather than papered over: these two packages cover
# only Halir & Flusser and Fitzgibbon -- the two most algebraically
# similar of the 7 methods. Kasa, Heydemann, Taubin, and Koning remain
# externally uncrossed and rely on the Tier 1 analytic oracle (Day 21).
validation = [
    "lsq-ellipse==2.2.1",
    "ellipsinator==0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src/hoqi_bench", "tests", "scripts", "conftest.py"]

[[tool.mypy.overrides]]
# scipy/sympy ship no py.typed marker / published stubs (as of the versions
# pinned above) -- these are missing-stub warnings, not real type errors, so
# silencing them here is scoped to exactly that, not a blanket ignore.
module = ["scipy.*", "sympy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# lsq-ellipse (imported as `ellipse`) and ellipsinator (Day 19's Tier 2
# external cross-validation, tests/test_external_cross_validation.py) ship
# no py.typed marker / published stubs either -- same rationale as above.
module = ["ellipse.*", "ellipsinator.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# tomli is a conditional dependency (`tomli>=2.0; python_version < '3.11'`,
# see pyproject.toml's [project] deps) -- stdlib `tomllib` covers 3.11+, so
# tomli is correctly ABSENT from a real 3.11 install. But config.py's
# `except ModuleNotFoundError: import tomli as tomllib` fallback still
# imports it, and mypy resolves imports against what's actually installed,
# not against the conditional marker -- caught by running mypy under an
# actual Python 3.11 venv (CI's matrix includes 3.11; the local dev venv is
# 3.10, where tomli is present, so this was invisible there).
module = "tomli"
ignore_missing_imports = true
