[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hoqi-bench"
version = "0.1.0"
description = "Reproducible benchmark for phase-recovery and nonlinearity-correction methods in homodyne quadrature interferometry (HoQI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nishad Suresh" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src/hoqi_bench", "tests", "scripts"]

[[tool.mypy.overrides]]
# scipy/sympy ship no py.typed marker / published stubs (as of the versions
# pinned above) -- these are missing-stub warnings, not real type errors, so
# silencing them here is scoped to exactly that, not a blanket ignore.
module = ["scipy.*", "sympy.*"]
ignore_missing_imports = true
